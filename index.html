<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>index td8 : fetch</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<main id="photo">
  <h1>Photo</h1>

  <section id="la_photo">
    <!-- rempli dynamiquement par Handlebars -->
  </section>
</main>

<script id="photoTemplate" type="text/x-handlebars-template">
  <img src="{{src}}" alt="{{titre}}">
  <h4>{{titre}}</h4>
  <p>{{description}}</p>
  <p>{{type}}, {{width}}x{{height}}</p>
  <h4 id="la_categorie">categorie : </h4>
  <h4>commentaires :</h4>
  <ul id="les_commentaires"></ul>
</script>

<script src="js/index.js" defer></script>
</body>
</html>
